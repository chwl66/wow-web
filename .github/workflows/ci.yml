# 静态检查与测试
# 触发:推送 main/master、Pull Request、或手动触发。
# 只做「装 devDeps → 自检 → 跑测试」,不碰 Gradle/APK —— 打包归 release.yml。
# 存在的意义:仓库里有 1600+ 条断言(test-headless.js + test-dom.js),
# 此前只能靠本地手动跑,没有任何机制保证下次还是绿的。

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # 与 release.yml 保持一致(Capacitor 8 CLI 要求 Node >= 22)
          node-version: 22
          cache: npm

      # jsdom 现为 devDependency(test-dom.js 需要),npm ci 默认会装
      - name: Install dependencies
        run: npm ci

      # js/version.js 由 package.json 派生,漏跑 npm version 会让线上版本与 APK 对不上
      - name: Verify version.js matches package.json
        run: |
          npm run gen:version
          if ! git diff --quiet -- js/version.js; then
            echo "::error::js/version.js 与 package.json 不一致。请本地运行 npm run gen:version 后提交。"
            git --no-pager diff -- js/version.js
            exit 1
          fi

      # 含数据交叉引用审计:拦下「数据定义了但玩家拿不到」的死内容(无掉落源的套装散件等)
      - name: Check html assets, script order & data integrity
        run: npm run check

      - name: Test
        run: npm test

      # 打包前最后一次确认 www/ 能正常生成,并留下体积记录
      - name: Sync web assets
        run: npm run www:sync

      # update-artifacts(全量包 + update.json)是安卓在线更新的命脉,发版前先跑通同一条路径
      - name: Smoke test update artifacts
        run: npm run www:artifacts -- --out "$RUNNER_TEMP/dist-update"

      # 版本比对预演:GH_TOKEN 必填,否则 gh 未认证 → latest 恒为空 → 永远判「需要发版」
      - name: Release preflight
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run bump:check
